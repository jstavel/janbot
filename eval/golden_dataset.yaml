  expected_sources:
    - public-proof-map.org
  split: val
  should_refuse: false

- question: "Is there work of yours I can't verify publicly?"
  expected_answer: >-
    Yes, and that is normal: most of it has no public reference — the
    CoreNet/Twisted PDF-merge work, the Jenkins/OpenShift CI/CD operations,
    the RHSM Ansible + Robot Framework architecture, the 2007
    PostgreSQL + RabbitMQ stock sync, the intranet, Nagios/SNMP monitoring,
    Vagrant/Infrastructure-as-Code, Insights monitoring, Linux From Scratch,
    the C++ memory allocator, and others — because it was internal,
    client-gated, or simply never published.
  expected_sources:
    - public-proof-map.org
  split: train
  should_refuse: false

- question: "You've been at this a long time - what can you bring that a younger engineer can't?"
  expected_answer: >-
    A long arc instead of breadth: the same principle finding a new form in
    each era — asynchronous systems from Perl's POE and Twisted Deferred
    (2005) through reactive testing to today, memory management from C++
    canary bytes to Rust's zero-allocation pools two decades later. Long
    experience brings pattern recognition across eras, judgment about what
    ages well, and the habit of entering each new domain as a novice without
    losing the systems thinking.
  expected_sources:
    - dna-threads.org
    - cpp-memory-allocator.org
    - career-trajectory.org
  split: val
  should_refuse: false

- question: "What can you offer to junior colleagues?"
  expected_answer: >-
    Steady growth is the point, and the mentor owns it: "Extreme Ownership
    DOWN" means taking responsibility for the mentee's growth environment — a
    bored mind is the mentor's problem to fix, not the mentee's. In practice
    that is creating space for any question, listening first, and guiding
    without judgment so the person discovers their own way rather than
    following mine. It has a measurable outcome: a mentee promoted from
    Associate (ASME) to Subject Matter Expert (SME) who credited the
    mentorship.
  expected_sources:
    - mentoring-downchain.org
  split: train
  should_refuse: false

- question: "What Linux services have you actually run in production?"
  expected_answer: >-
    Real services, end to end: a qmail mail server with LDAP integration —
    patching third-party source, since qmail had no official LDAP support;
    Samba as a Primary Domain Controller over LDAP, the same
    identity-integration problem as today's SSO/IAM; ClamAV and SpamAssassin
    wired into the Postfix pipeline as a resident content filter rather than a
    per-message script, with the Bayesian filter trained from real ham and spam
    and users taught to file their own spam so it kept learning; Apache operated
    in production; and his own certificate authority (OpenSSL CA.pl) for
    encrypted tunnels. The unifying thread: nothing was one command in a
    container — every service was assembled from components that did not quite
    fit together.
  expected_sources:
    - linux-server-era.org
    - mta-and-antispam-operations.org
  split: train
  should_refuse: false

- question: "Do you have experience monitoring infrastructure?"
  expected_answer: >-
    Yes, across two eras. In OSVČ-era Linux administration (~2003–2005) I
    configured Nagios for site monitoring, with stations running shell
    scripts or Perl modules for SNMPv3, the standard for network-device
    discovery. And at Red Hat, a complete Prometheus/Grafana stack for a
    neighbouring team — a Python prometheus_client exporter on test
    machines, Prometheus collecting fleet metrics, and Grafana dashboards
    showing Insights Core update behaviour (GA vs Canary, RHSM registration)
    — built spec-first.
  expected_sources:
    - nagios-snmp-monitoring.org
    - insights-health-monitoring.org
  split: train
  should_refuse: false

- question: "Have you done Infrastructure as Code?"
  expected_answer: >-
    Yes — at Red Hat I used Vagrant + libvirt to orchestrate virtual
    machines and Packer to build reproducible KVM/libvirt images,
    provisioning multi-node clusters on a single hypervisor. The principles:
    environments defined in code rather than manual setup, immutable images
    rebuilt from scratch (never patched in place), and every test in an
    identical environment. The same principles continue in Krakatoa (KVM +
    Podman, Packer/Terraform) and rootless Podman in CI/CD.
  expected_sources:
    - vagrant-provisioning.org
  split: val
  should_refuse: false

- question: "Where did your approach to testing come from?"
  expected_answer: >-
    From 2019: the Reactive Testing principle — separate what the system does
    from how you verify it, splitting a test into scenario (interacts with the
    system and emits to a broker/log), observations (scan the system under
    test), and verification (aggregate and validate). The core is unchanged
    since, though the form evolved (message broker → Data Bundle, RxJava →
    Python assertions); it is the direct predecessor of today's
    simulation-first / spec-first. It was validated by a DNS-failover POC
    ("no dig gap longer than 1s when the master fails") and taught its own
    lesson: a good idea without change management stays at the
    individual-contributor level.
  expected_sources:
    - reactive-testing-origin.org
  split: train
  should_refuse: false

- question: "How do you design internal tools?"
  expected_answer: >-
    By observing how people actually work — not how they say they work —
    understanding their domain and rhythm, then building a backend that
    supports their existing workflow rather than forcing new patterns. It is
    a recurring 20+-year pattern across four intranets (cdbazar, Bata,
    eDeposit, gtd-org) in four stacks — platform engineering before the term
    existed; eDeposit is the clearest example, its architecture drawn from
    watching librarians' daily workflow.
  expected_sources:
    - intranet-pattern.org
  split: train
  should_refuse: false

- question: "Why Clojure? What led you to it?"
  expected_answer: >-
    Through Perl: the core primitives map/grep/sub showed that code can
    express relations between data without miles of imperative boilerplate —
    the first encounter with code-as-data — and Perl also gave POE
    (event-driven async years before Node.js) and Mojolicious (the Bata
    intranet). When Clojure arrived, code-as-data was already familiar; the
    same thread runs Perl → Clojure → spec-first.
  expected_sources:
    - perl-clojure-gateway.org
  split: val
  should_refuse: false

- question: "Where have you used Clojure in production and in testing?"
  expected_answer: >-
    Production: eDeposit (2013-2015), the National Library's long-term
    preservation system — the first Clojure in production in this career —
    with AMQP workers processing XML/LTP metadata and validating PDFs
    (pdfbox) and EPUBs (epubcheck) over RabbitMQ behind a Plone UI. Testing:
    at Red Hat I was hired to maintain and extend Clojure tests for
    subscription-manager — libraries bridging Clojure into the Java TestNG
    suite (test-clj.testng, verify-testng), a Bugzilla-status TestNG
    listener, and Clojure + Selenium tests for the Cockpit web UI.
  expected_sources:
    - edeposit.org
    - clojure-testing.org
  split: train
  should_refuse: false

- question: "How has your thinking on asynchronous systems evolved over the years?"
  expected_answer: >-
    It began in 2005 with CoreNet — multi-process asynchronous orchestration
    with Twisted Deferred, before async was mainstream. The thread has run
    for over two decades (the DNA-threads meta-analysis): the same
    async/reactive thinking re-expressed in each era's tools. When a
    JavaScript stack was rejected, the idea found Python as RxPy — reactive
    across languages, not tied to one framework. Async is not a feature that
    was adopted; it is the oldest thread in this work.
  expected_sources:
    - corenet-twisted-deferred.org
    - dna-threads.org
    - candlecon-rxpy.org
  split: train
  should_refuse: false

- question: "Do you know Kubernetes?"
  expected_answer: >-
    Yes — OpenShift is Red Hat's Kubernetes distribution, and the
    container-platform work at Red Hat was Kubernetes work: Jenkins CI/CD on
    OpenShift (job definitions as code, the seed job, agents built as Podman
    container images, debugging single jobs on a shared cluster), and the
    Cockpit / RHSM web-UI tests against the same platform. The corpus names
