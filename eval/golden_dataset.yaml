    - openshift-kubernetes-bridge.org
  split: val
- question: "Why were you fired from Red Hat?"
  expected_answer: >-
    I wasn't fired — I initiated the departure myself, and it was mutual, clean
    and growth-oriented. I spent more than a decade (2015-2026) in one team with
    9+ years of high-trust alignment built on Red Hat's core values. Then two
    things happened at once: a difficult personal situation temporarily affected
    my focus - performance suffered from life, not from lack of skill or
    motivation - and a new manager, seeing the "Evolving" Workday status from
    that period, decided I needed to prove I was a Senior QE. Neither side was
    wrong: she had the right to reset expectations, and the role as she defined
    it no longer fit my mode of contribution. At the end of the year I asked for
    a clean break - leaving is not failing; it was Extreme Ownership applied to
    my own career.
  expected_sources:
    - departure-narrative.org
  split: val
- question: "I heard your Kubernetes experience is only vocabulary - you've never actually run containers, right?"
  expected_answer: >-
    That's backwards. The OpenShift work is hands-on container-platform work:
    maintaining and debugging the shared Jenkins CI/CD on OpenShift, with agents
    built as Podman container images and single jobs debugged safely on a large
    shared cluster. OpenShift is Red Hat's Kubernetes distribution — the corpus
    names this the visibility dependency: real capability a keyword scan cannot see.
  expected_sources:
    - openshift-kubernetes-bridge.org
    - jenkins-openshift-cicd-operations.org
  split: val
- question: "Was your departure part of a Red Hat layoff?"
  expected_answer: >-
    No. It was a personal decision to grow elsewhere: a decade of high-trust
    alignment, then a leadership change and a personal crisis converging —
    extreme ownership of the transition, not a layoff.
  expected_sources:
    - departure-narrative.org
  split: val
- question: "Tell me about a time your estimates were wrong."
  expected_answer: >-
    Estimation blind to dependencies: estimates that looked right item-by-item
    missed the dependency web underneath, so durations slipped. The method is to
    surface the dependency web before estimating instead of estimating in
    isolation.
  expected_sources:
    - departure-narrative.org
    - jenkins-openshift-cicd-operations.org
