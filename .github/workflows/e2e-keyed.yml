name: E2E (keyed)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-keyed:
    name: port-only e2e (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the keyed port-only suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$(printf '%s' "${OPENROUTER_API_KEY}" | tr -d '[:space:]')" ]; then
            echo "OPENROUTER_API_KEY is not set; skipping the keyed e2e run."
            exit 0
          fi
          set +e
          output="$(uv run pytest tests/e2e -q 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          [ "$code" -eq 0 ] || exit "$code"
          if printf '%s' "$output" | grep -q 'skipped'; then
            echo "::error::the keyed e2e rows were skipped despite a key being set"
            exit 1
          fi
