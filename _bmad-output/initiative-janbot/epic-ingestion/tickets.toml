[[entry]]
id = 11
type = "story"
title = "Source-diverse retrieval window"
description = "Make the retrieval window source-diverse — over-fetch chunks (already done), then select the top-k DISTINCT sources (best-ranked chunk per source), so k chunks = k distinct sources. Deterministic -> probe FIRST (no model): record which of the diagnosed items {23, 25, 29, 32} enter the window, in both dense and hybrid, BEFORE any keyed run. The prediction is already visible in the 2.10 probe (epic-ingestion/run-7c868e2f-probe.txt): a k=4 window can hold fewer than 4 distinct sources because one org file yields several chunks (subtrees + file-root) — item 29 dense k=4 is ['cdbazar.org', 'nagios-snmp-monitoring.org', 'intranet-pattern.org', 'intranet-pattern.org'] (intranet-pattern.org x2), item 25 dense is career-trajectory.org x2, item 32 dense is clojure-testing.org x2. So in DENSE mode item 29 ENTERS once deduped — the rank-5 chunk vagrant-provisioning.org fills the slot freed by the duplicate; items 25 and 32 stay out (their expected sources are rank 68/64 and rank 15), and item 23 stays out (dense rank 15, no duplicate to free a slot). Two effects the fix addresses: (a) duplicate sources crowd out would-be sources (retrieval_accuracy; multi-source items like 25); (b) retrieval_mrr ranks the RAW chunk list, so duplicates inflate an expected source's rank. Then one keyed val run at top_k=4 against e635c2bf, judged on the TRANSFER metrics (citation_correctness, faithfulness) + citation_precision; verdict routed to entry 20's breadth decision. OPEN DESIGN DECISIONS for the plan: (i) where — the store's selection (it owns over-fetch + ranking) vs the program; (ii) knob vs default — this is arguably a CORRECTNESS FIX (the window should be source-diverse, since answers/citations are source-level), not a tuning knob; if kept off-by-default it must be a documented mode, but note the dense path is then NO LONGER byte-identical, so the order-asserting store tests must change (legitimately — a behavior change, not a break)."
verify = "The retrieval window holds up to k distinct sources (best chunk per source); the deterministic probe over the four diagnosed items is recorded before any keyed run; one keyed val run at top_k=4 against e635c2bf records before/after retrieval_accuracy / retrieval_mrr / citation_correctness / faithfulness (+ citation_precision) with the selection in the params; the verdict states whether a gate metric moved beyond the 1.5σ floor (>= 3 items at n=15) or is within noise and routed to entry 20."
covers = ["CAP-5"]
after = ["5.19"]
hitl = true
risk = "medium"
