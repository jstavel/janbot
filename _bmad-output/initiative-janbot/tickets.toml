# tickets.toml — initiative-janbot. Milestone 1 epics, in build order.
# `id` names an epic for good; entries in other epics refer to this epic's entries as <epic id>.<entry id>.

[[epic]]
id = 1
slug = "epic-foundation"
title = "Workspace, tooling & CI baseline"
covers = []

[[epic]]
id = 2
slug = "epic-ingestion"
title = "Org-mode ingestion & fail-closed scope"
covers = ["CAP-4", "CAP-5"]
after = [{ epic = 1, needs = "the package layout, config loading and dependency wiring" }]

[[epic]]
id = 3
slug = "epic-rag-chat"
title = "DSPy answer + citation pipeline via /chat"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-6"]
after = [{ epic = 2, needs = "a populated ChromaDB index built from public_profile_org/" }]

[[epic]]
id = 4
slug = "epic-verification"
title = "End-to-end tests & CI"
covers = ["CAP-7"]
after = [{ epic = 3, needs = "the running /chat endpoint and its contract" }]
