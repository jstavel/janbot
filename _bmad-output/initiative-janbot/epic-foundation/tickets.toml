type = "story"
title = "Configuration loading"
description = "Adds the configuration module that reads model mode, the locked snapshot id, the corpus path and the index path from the environment, with documented defaults."
verify = "With no variables set the documented defaults load; setting each variable overrides it."
covers = ["E3"]
after = [1]
hitl = false
risk = "low"

[[entry]]
