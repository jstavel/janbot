# tickets.toml — epic-foundation. Planned entries in build order; no leaf file until an entry is pulled.

[[entry]]
id = 1
type = "story"
title = "Project scaffold & runnable skeleton"
description = "Creates the uv-managed Python project with the spine's package layout (api, pipeline, ingest, store, llm), pins the Milestone 1 dependencies, adds a FastAPI app skeleton with a health route, and a smoke test that imports the package."
verify = "uv sync on a clean checkout succeeds; uv run pytest passes the smoke test; the skeleton service starts."
covers = ["E1", "E2"]
after = []
hitl = true
risk = "low"

[[entry]]
