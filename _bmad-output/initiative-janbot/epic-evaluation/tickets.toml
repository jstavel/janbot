# tickets.toml — epic-evaluation. Milestone 2 entries in build order.
# `id` names a child for good; refer to an entry from another epic as <epic id>.<entry id>.
# Status never lives here: an entry with no plan and no leaf file is planned.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: seed dataset, run the pipeline, record a metric in MLflow"
description = "Stands up the eval skeleton: a version-controlled seed of recruiter Q&As, a runner that puts each question through the pipeline under the locked snapshot, a metric-registration interface (with a stub metric), and a recorded MLflow run carrying that metric. A person starts the MLflow tracking server."
verify = "An MLflow run recorded from the seed dataset carries one metric produced through the runner under the locked snapshot (the metric may be a stub)."
covers = ["E1", "E2", "E3"]
after = ["epic-rag-chat"]
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Golden dataset completed"
description = "The full golden dataset of recruiter questions, each with an expected answer and expected sources, authored and reviewed by the owner."
verify = "Every golden question carries an expected answer and expected sources, and the set is version-controlled."
covers = ["E1"]
after = [1]
hitl = true
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Retrieval-accuracy metric"
description = "Per-question and aggregate retrieval accuracy: whether the expected sources are among the sources retrieved for the question."
verify = "Running the eval emits per-question and aggregate retrieval-accuracy numbers against the golden dataset."
covers = ["E2"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Citation-correctness metric"
description = "Per-question and aggregate citation correctness against a single expected source per item. Contract (owner ruling 2026-10-14): a citation is correct when it names a source the answer used and the corpus grounds. The pipeline's retrieved-set guard already rejects any source not retrieved, so a retrieved-but-unlisted source must not be scored as an error: score containment (expected subset of cited) and record precision as a separate count, never as an exact-set mismatch."
verify = "Running the eval emits per-question and aggregate citation-correctness numbers against the golden dataset, and a retrieved-but-unlisted source is not scored as a citation error."
covers = ["E2"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Hallucination metric via LLM-as-a-judge"
description = "An LLM-as-a-judge scores each answer against the golden expected answer, using the config-driven judge model (default the locked snapshot); the verdict label and aggregate are recorded."
verify = "Running the eval emits a per-question judge verdict and an aggregate hallucination score against the golden dataset."
covers = ["E2"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "MLflow run records: config, metrics and comparability"
description = "Extends the tracer's MLflow recording: each run logs its config (model, snapshot, temperature, seed) and all metrics, plus the dataset revision as an artifact, so two runs can be compared."
verify = "Two eval runs recorded in MLflow expose their config and metrics side by side."
covers = ["E3"]
after = [2, 3, 4, 5]
hitl = false
risk = "low"

[[entry]]
id = 7
type = "story"
title = "Baseline recorded + optimization decision"
description = "The baseline manual program is evaluated and recorded; the recorded metrics decide whether a BootstrapFewShot stage is needed, recorded as a dated decision."
verify = "A baseline run is recorded with all metrics, and a recorded decision states whether BootstrapFewShot is needed and why."
covers = ["E4"]
after = [2, 3, 4, 5, 6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "BootstrapFewShot stage"
description = "Compile the program with BootstrapFewShot only when entry 7 showed a need, and record the resulting run and comparison; when there is no need, the skip is the recorded outcome."
verify = "Either a recorded run shows the BootstrapFewShot-compiled program's metrics against the baseline with its compilation config, or a recorded decision shows the stage was skipped as unneeded."
covers = ["E4"]
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "MIPROv2 stage"
description = "Compile with MIPROv2 only when the BootstrapFewShot stage showed a need, and record the resulting run and comparison; when there is no need, the skip is the recorded outcome."
verify = "Either a recorded run shows the MIPROv2-compiled program's metrics against the prior stage with its compilation config, or a recorded decision shows the stage was skipped as unneeded."
covers = ["E4"]
after = [8, 14]
hitl = false
risk = "high"
plan_checkpoint = true

[[entry]]
id = 10
type = "story"
title = "Refactor sweep"
description = "Cleanup of the eval module and its plans, scoped when it starts from the epic's deferred findings."
verify = "The eval suite passes with no dead code, and the sweep's scope is recorded."
covers = []
after = [1, 2, 3, 4, 5, 6, 7, 8, 9]
hitl = false
risk = "low"

[[entry]]
id = 11
type = "story"
title = "End-to-end eval suite"
description = "One runnable suite that runs the recorded eval end to end and asserts the deterministic metrics: repeated runs under the locked snapshot agree on retrieval-accuracy and citation-correctness."
verify = "The suite runs green and fails when a deterministic metric changes between two runs under the locked snapshot."
covers = ["E2", "E5"]
after = [10]
hitl = true
risk = "medium"

[[entry]]
id = 12
type = "story"
title = "Golden dataset expansion: public-reference and stance items"
description = "Adds four corpus-grounded items from the golden-question brainstorm: a 'Tell me about yourself' intro item (new personal-intro corpus object, re-extracted), a remote/onsite/hybrid stance item (the conviction, not the customer nuance), a fail-closed anti-hallucination item, and an eDeposit public-URL ownership trap. The URL allow-list and further items are deferred (see deferred-work)."
verify = "eval/golden_dataset.yaml holds 24 items; every expected_sources path exists in public_profile_org/ and load_golden_dataset parses it."
covers = ["E1"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 13
type = "story"
title = "Refusal item class and refusal metrics"
description = "Adds a should-refuse item class to the golden dataset (a per-item marker on GoldenItem) and metrics that score a clean decline as pass for those items while a declined in-corpus question stays a failure; 2-3 refusal items on deliberately out-of-corpus topics (Kubernetes, salary, notice period). Waits on the graceful decline (epic-graceful-decline) so a decline has a defined, contract-conforming shape to score."
verify = "The dataset marks should-refuse items; running the eval scores a decline as pass for them and a false refusal as failure; the refusal metrics appear in the MLflow run."
covers = ["E2"]
after = ["epic-graceful-decline", 16]
hitl = true
risk = "medium"

[[entry]]
id = 17
type = "story"
title = "Golden dataset train/val split and a val baseline"
description = "Compilation and evaluation run over the same 36 items, so 'compiled vs baseline' is train-on-test — a gain may be memorization. Add a per-item `split: train|val` marker ({GoldenItem.split}; loader validates it fail-closed, `load_golden_dataset(path, split=None)` filters, None = all and stays backward compatible). The compile CLI takes `--split` and refuses anything but `train` (never `all`); the eval CLI takes `--split {all,train,val}` (default keeps historical runs; gate runs are explicitly `val`). Annotate all items in one stratified pass (~60/40 → 22 train / 14 val; stratify by source and item class so val is not all-JanBot). Record `split` and `trainset_size` in run params plus a split-manifest artifact. Re-measure the baseline on the val split — the entry-7 baseline (all 36) is not a valid gate reference. Do the GoldenItem per-item-field change in one schema pass together with entry 13's should_refuse marker."
verify = "The dataset carries a per-item split; the compile CLI refuses a non-train split; the eval CLI accepts train|val|all; a recorded compile+eval pair carries the split, a split-manifest artifact and '<metric>__n'; and a val baseline run exists, so compiled-vs-baseline is measured on the same held-out items."
covers = ["E1"]
after = [12]
hitl = true
risk = "medium"

[[entry]]
id = 18
type = "story"
title = "Pre-registered optimization gate rule"
description = "Write, before the val re-runs, the decision rule the optimization gate applies, so a stage (5.8/5.9) is judged against a pre-committed rule, not a post-hoc threshold. With the val split (~14 items, p≈0.66) the noise floor 1.5*sigma≈0.19 (~3 items): a stage is accepted only when, on the same val items, it improves a targeted metric beyond the noise floor without regressing the other beyond its own; a change within the noise is recorded as 'no decision', not 'improvement' or 'regression'. 'Breadth gates optimization': a ~5% effect is detectable only once val grows to ~100 items, so dataset growth is the precondition for a decidable gate; a 3-fold (3x12, mean +- variance) is the small-n alternative. The rule is recorded, and the compiles/evals run against it."
verify = "A pre-registered rule names, per gate stage, the metric(s), the acceptance thresholds beyond the noise floor, and the 'no decision' band; the 5.14 and 5.9 stages are judged against it."
covers = ["E4"]
after = [17]
hitl = true
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "Multi-objective compile metric (citations + faithfulness)"
description = "Revise the BootstrapFewShot compile objective so it does not buy citation coverage at the cost of faithfulness — the Goodhart trade entry 8 exposed. Objective: score = w_c*cited_ok + w_f*faithful (default 0.5/0.5, recorded in the compile hyperparams); a demo is accepted only when cited_ok AND faithful, short-circuiting to False without a judge call when cited_ok is false (keeps it near-free). Only program-controlled terms — retrieval_accuracy and answer_coverage (stub) do not belong. Store the (cited_ok, faithful) pair per item, not only the scalar, so a Pareto/GEPA objective needs no recompute, and leave room for a refusal_ok term once entry 13 lands."
verify = "Compiled over the train split and evaluated on the val split against a val baseline, the multi-objective compiled program holds or improves citations without reducing faithfulness, with the weights in the compile hyperparams."
covers = ["E4"]
after = [8, 15, 16, 17, 18]
hitl = false
risk = "medium"

[[entry]]
id = 15
type = "story"
title = "Retrieval MRR (mean reciprocal rank)"
description = "retrieval_accuracy is binary — it cannot tell rank 1 from rank 4, so it hides the item-5 finding (the expected source sat at rank 4 and top_k=4 barely saved it). Add retrieval_mrr = mean(1 / rank of the first expected source) over the same eligible items as retrieval_accuracy; it is data-level and judge-free, and shows whether chunking/top_k/hybrid search actually help."
verify = "The eval emits retrieval_mrr alongside retrieval_accuracy over the same eligible items; a source at rank 4 scores lower than at rank 1."
covers = ["E2"]
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 16
type = "story"
title = "Metric hygiene: numerator contracts (polarity, denominators, one eligibility)"
description = "Harden the metric layer in one change (one signature, one test pass). (1) register_metric(name, metric, *, denominator) — denominator is keyword-only and required; a metric without one is refused (fail fast). (2) metric_counts(outcomes) -> dict[str,int] returning {f'{name}__n': ...} for every registered metric; the runner logs '<metric>__n' beside each score in the same MLflow run (in log_metrics, numeric so it charts with the score); RunResult gains counts, and the CLI prints 'name: 0.5430 (n=35)'. (3) polarity: register_metric gains higher_is_better so a metric's direction is explicit (faithfulness must never read inverted). (4) one eligibility(item, outcome) — treating a declined response (status=insufficient) as excluded — extracted from today's inline comprehensions into named helpers, threaded through every metric (values must not move), with faithfulness computed only over answered and judged items. An invariant test asserts every registered metric has a '<name>__n' in metric_counts."
verify = "Every run records '<metric>__n' beside every score, each n matching that metric's own population (e.g. faithfulness over judged items only); registering a metric without a denominator fails; metric values are unchanged from before the refactor."
covers = ["E2"]
after = [3, 4, 5]
hitl = false
risk = "medium"

[[entry]]
id = 19
type = "story"
title = "Diagnose the val misses"
description = "From the baseline run e635c2bf, take the failing val items (the `retrieval: ...` misses and the unfaithful judged items) and classify each cause as (a) corpus gap, (b) retrieval miss, or (c) program error. Output a written diagnosis (epic Notes) that routes each class to its owning epic."
verify = "Every failing item has a named cause; the counts reconcile to 1 - metric (0.73 -> 4/15); the diagnosis routes the fix (data -> epic-evaluation; behavior -> epic-ingestion / epic-rag-chat)."
covers = ["E2"]
after = [17]
hitl = true
risk = "low"

[[entry]]
id = 20
type = "story"
title = "Golden dataset breadth toward the gate power"
description = "Decide and execute the golden-dataset breadth strategy toward gate power, GIVEN the retrieval-recovery result (epic-ingestion entries 9 and 10; entry 10 is the decisive lever). The gap: entry 12 targets 24, the dataset is 38 (23 train / 15 val); gate-rule.md needs ~100 val for a ~5% effect. FIRST task: decide breadth given the retrieval-recovery result — if the retrieval change moved a gate metric beyond the 1.5σ floor, breadth may be unnecessary at this stage; if it stayed within noise, breadth (grow) is the precondition for a decidable gate. Options: (i) grow items (stratified by source and item class; ~+85 val / ~250 total), (ii) the gate rule's 3x12 fallback (note: it cures run-variance, not item-level binomial noise — and the diagnosed misses are deterministic retrieval, so repeats add nothing for THIS bottleneck), or (iii) consciously accept \"no decision\" for now. Then execute the chosen strategy and record a new val baseline as the gate reference if items were added. Any 3-source-item guidance is NOT a dataset rule: it is conditional on top_k staying 4 and is epic-ingestion entry 9's to fix, not the data's. Authoring follows the question-class taxonomy (epic-evaluation Notes, 2026-10-15): growth is \"~85 val items DISTRIBUTED ACROSS THE CLASSES\" — each class probes a distinct failure mode (fact lookup -> recall; narrative/arc -> faithfulness, multi-chunk; multi-source synthesis -> retrieval coverage, the k-boundary; strengths/depth -> over-claiming; weakness/honest self-assessment -> grounded, not embellished; stance/opinion -> conviction; adversarial/false premise -> accepting a lie; refusal/out-of-corpus -> clean decline; attribution trap -> the public/private boundary; voice/intro -> verbatim fidelity); every class stratified into both train and val; >= ~3 val items per class; item sources spread across the corpus. N (how many val items must actually stress grounding) is a MEASURED property (the class-audit finding: class labels do not predict grounding pressure; source count does not either). Target ~9 val grounding-pressure items (the audit's ~3x headroom over the floor's 3-item gain, per the asymmetry note — each improvement destabilises ~1 item). Method after authoring: (a) SCREEN deterministically — a context-perturbation probe over the val items (top_k 4 vs 6; dense vs hybrid; chunks vs sources) flags items whose retrieved WINDOW changes -> the \"context-sensitive\" candidate set; free, no model, and it OVER-PREDICTS (necessary, not sufficient — 2.11 changed many windows but moved only ~5 verdicts), so aim the candidate set comfortably above N; (b) CONFIRM in the keyed val run — the pressure count is the number of val items whose faithfulness verdict moves under the perturbation; (c) ITERATE authoring until the confirmed count >= ~9. Authoring is not hitl; the keyed val run is (it needs the operator key). The optimization stages (8/9) stay gated on a decidable gate — this breadth is their precondition, not a stage restart."
verify = "Either the dataset carries ~100 val items (every expected source in public_profile_org/) with a new recorded val baseline, or the chosen alternative is recorded with its rationale."
covers = ["E1"]
after = [12, "2.9", "2.10", "2.11"]
hitl = false
risk = "high"

[[entry]]
id = 21
type = "story"
title = "Golden dataset class audit"
description = "Map the current 38 items to the question-class taxonomy (epic-evaluation Notes, 2026-10-15: ten classes from the failure taxonomy); name the missing / thin classes (expected gaps: 5 weakness/honesty, 7 adversarial, 9 attribution trap). Then — the important part — COUNT how many items put grounding under pressure (the population where faithfulness can actually move, per the asymmetry note). The earlier hypothesis (\"val is mostly fact-lookup\") is REFUTED: 2.11 destabilised items 14/17/19/22/36, so the val DOES carry grounding-pressure items. State two consequences: (a) which classes to author — independent of the breadth decision; (b) how many grounding-pressure items val needs so the gate can ACCEPT via a real gain rather than only reject."
verify = "The 38 items are mapped to classes; the missing/thin classes are named; the grounding-pressure count is recorded; the consequences for entry 20 are stated."
covers = ["E1"]
hitl = false
risk = "low"
