[project]
name = "janbot"
version = "0.1.0"
description = "JanBot — grounded answers over an org corpus"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "dspy==3.4.0",
    "chromadb==1.5.9",
    "orgparse==0.5.20260926",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
